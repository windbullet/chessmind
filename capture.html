<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>ChessMind state capture</title>
    <style>
      html, body { margin: 0; padding: 0; background: #0b0e15; overflow: hidden; }
      iframe { width: 100vw; height: 100vh; border: 0; display: block; }
    </style>
  </head>
  <body>
    <iframe id="frame" src="/"></iframe>
    <script>
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      const waitFor = async (fn, timeout = 10000) => {
        const start = Date.now();
        while (Date.now() - start < timeout) {
          const value = fn();
          if (value) return value;
          await wait(50);
        }
        return null;
      };
      const state = new URLSearchParams(location.search).get('state') || 'board';
      const frame = document.getElementById('frame');
      frame.addEventListener('load', async () => {
        const win = frame.contentWindow;
        const api = await waitFor(() => win.__CHESSMIND__);
        if (!api) {
          document.title = 'no-debug-bridge';
          return;
        }
        const game = api.game;
        const doc = frame.contentDocument;
        await wait(400);
        const sq = (name) => doc.querySelector(`[data-square="${name}"]`);
        const buttonWith = (text) =>
          [...doc.querySelectorAll('button')].find((b) => b.textContent?.includes(text));

        if (state === 'hints') {
          game.getState().startGame({ players: { w: 'human', b: 'human' }, orientation: 'w' });
          await wait(300);
          sq('e2')?.click();
          await wait(500);
        }

        if (state === 'capture-hint') {
          game.getState().startGame({ players: { w: 'human', b: 'human' }, orientation: 'w' });
          await wait(300);
          game.getState().humanMove('e2', 'e4');
          game.getState().humanMove('d7', 'd5');
          await wait(300);
          sq('e4')?.click();
          await wait(500);
        }

        if (state === 'settings') {
          buttonWith('设置')?.click();
          await wait(500);
          const body = doc.querySelector('.side-column .panel-body');
          if (body) body.scrollTop = 430;
        }

        if (state === 'setup') {
          game.getState().openSetup({ source: 'new', blank: true });
          await wait(200);
          const st = game.getState();
          st.setSetupPiece('e1', { type: 'k', color: 'w' });
          st.setSetupPiece('e8', { type: 'k', color: 'b' });
          st.setSetupPiece('d1', { type: 'q', color: 'w' });
          st.setSetupPiece('d8', { type: 'q', color: 'b' });
          st.setSetupPiece('c4', { type: 'b', color: 'w' });
          st.setSetupPiece('f5', { type: 'b', color: 'b' });
          st.setSetupPiece('g1', { type: 'n', color: 'w' });
          st.setSetupPiece('b8', { type: 'n', color: 'b' });
          st.setSetupPiece('a2', { type: 'p', color: 'w' });
          st.setSetupPiece('h7', { type: 'p', color: 'b' });
        }

        if (state === 'dialog') {
          buttonWith('新对局')?.click();
          await wait(400);
        }

        if (state === 'live') {
          game.getState().startGame({ players: { w: 'human', b: 'human' }, orientation: 'w' });
          await wait(200);
          game.getState().humanMove('e2', 'e4');
          game.getState().humanMove('c7', 'c5');
          game.getState().humanMove('g1', 'f3');
          game.getState().humanMove('d7', 'd6');
          await wait(300);
          sq('f1')?.click();
          await wait(500);
        }

        if (state === 'light') {
          api.settings.getState().updateUi({ theme: 'light', boardTheme: 'walnut' });
          game.getState().startGame({ players: { w: 'human', b: 'human' }, orientation: 'w' });
          await wait(300);
          sq('d2')?.click();
        }

        await wait(700);
        document.title = 'ready';
      });
    </script>
  </body>
</html>
