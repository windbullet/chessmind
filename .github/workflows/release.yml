name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release

      - run: npm ci

      - name: Check the tag matches package.json
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $pkg) {
            throw "tag v$tag does not match package.json version $pkg"
          }
          "Building ChessMind $tag"

      - name: Build the installer and the portable archive
        run: npm run dist

      - name: Extract release notes from CHANGELOG.md
        shell: pwsh
        run: |
          node scripts/release-notes.mjs "${{ github.ref_name }}" > notes.md
          Get-Content notes.md -TotalCount 3

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = "${{ github.ref_name }}" -replace '^v', ''
          $setup = "release/ChessMind-$v-win-x64-setup.exe"
          $zip = "release/ChessMind-$v-win-x64.zip"
          foreach ($file in @($setup, "$setup.sha256", $zip, "$zip.sha256")) {
            if (-not (Test-Path $file)) { throw "missing artefact $file" }
          }
          gh release create "${{ github.ref_name }}" `
            --title "ChessMind $v" `
            --notes-file notes.md `
            $setup "$setup.sha256" $zip "$zip.sha256"
